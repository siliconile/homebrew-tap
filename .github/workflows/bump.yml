name: Bump Nook

# Points the cask at the latest Nook release. Runs every 6 hours and on demand,
# so no cross-repo token is needed in the Nook release workflow.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update cask to latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CASK=Casks/nook-notch.rb
          TAG=$(gh release view --repo siliconile/Nook --json tagName -q .tagName)
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' "$CASK")
          if [ "$VERSION" = "$CURRENT" ]; then echo "Up to date ($VERSION)"; exit 0; fi
          SHA=$(curl -fsSL "https://github.com/siliconile/Nook/releases/download/$TAG/Nook-$VERSION.zip.sha256" | cut -d' ' -f1)
          [ ${#SHA} -eq 64 ] || { echo "Bad sha256: $SHA"; exit 1; }
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nook-notch $VERSION"
          git push
